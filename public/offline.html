<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · Goldtribe Link Laundromat</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0c0418;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      background: #130722;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
    }
    .badge {
      display: inline-block;
      background: #FED65B;
      color: #1c1b1b;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.6;
      margin: 0 0 20px;
    }
    button {
      background: #5E228B;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Offline Mode · Hali ya Nje ya Mtandao</span>
    <h1>You are currently offline</h1>
    <p>
      Mtandao wako umekatika kwa muda. Your saved order receipts remain accessible once reconnected, or call our Rongai &amp; Ngong rider desk directly at <strong>0777 349 743</strong>.
    </p>
    <button onclick="window.location.reload()">Retry Connection · Jaribu Tena</button>
  </div>
</body>
</html>
